<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>분수교구함</title>
  <meta name="description" content="분수 하나를 막대·원·수직선으로 함께 보는 단일 화면 분수 교구">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header">
    <div class="logo">
      <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true" focusable="false">
        <rect x="3" y="12" width="34" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="2.5"/>
        <rect x="3" y="12" width="25.5" height="16" rx="3" fill="var(--accent)"/>
        <path d="M11.5 12v16M20 12v16M28.5 12v16" stroke="currentColor" stroke-width="2"/>
      </svg>
      <div class="logo-text">
        <h1>분수교구함</h1>
        <p class="tagline">분수 하나를 막대·원·수직선으로 함께 봐요</p>
      </div>
    </div>
    <div class="toolbar">
      <button type="button" class="tb" data-action="big" aria-pressed="false">큰 글씨</button>
      <button type="button" class="tb icon" data-action="theme" aria-label="라이트/다크 테마 바꾸기" id="btn-theme">🌙</button>
      <button type="button" class="tb icon" data-action="help" aria-label="도움말">?</button>
      <button type="button" class="tb" data-action="reset">처음 상태로</button>
    </div>
  </header>

  <main id="app" class="layout">
    <!-- 분수 입력 -->
    <section class="panel panel-input" aria-labelledby="h-input">
      <h2 id="h-input">분수 만들기</h2>
      <div class="input-body">
        <div class="frac-input" role="group" aria-label="분자와 분모">
          <div class="stepper">
            <button type="button" data-action="n-" aria-label="분자 줄이기">−</button>
            <output id="val-n" aria-label="분자">3</output>
            <button type="button" data-action="n+" aria-label="분자 늘리기">+</button>
            <span class="stepper-name">분자</span>
          </div>
          <div class="frac-bar" aria-hidden="true"></div>
          <div class="stepper">
            <button type="button" data-action="d-" aria-label="분모 줄이기">−</button>
            <output id="val-d" aria-label="분모">4</output>
            <button type="button" data-action="d+" aria-label="분모 늘리기">+</button>
            <span class="stepper-name">분모</span>
          </div>
        </div>
        <div class="chips-wrap">
          <h3>자주 쓰는 분수</h3>
          <div class="chips" id="chips" role="group" aria-label="자주 쓰는 분수"></div>
          <p class="hint">막대나 원의 칸을 눌러도 색칠돼요.</p>
        </div>
      </div>
    </section>

    <!-- 모델 -->
    <section class="stage" aria-label="분수 모델">
      <div class="panel number-panel" id="numbers">
        <div class="sym-big" id="sym" aria-live="polite"></div>
        <div class="sym-extra">
          <div class="sym-item" id="mixed" hidden><small>대분수</small><b></b></div>
          <div class="sym-item" id="decimal"><small>소수</small><b></b></div>
          <div class="sym-item" id="reading"><small>읽기</small><b></b></div>
        </div>
        <div class="check-row">
          <label><input type="checkbox" data-show="decimal" checked> 소수</label>
          <label><input type="checkbox" data-show="reading" checked> 읽기</label>
        </div>
      </div>
      <div class="model-toggles" role="group" aria-label="모델 표시 선택">
        <span class="toggles-label">보기</span>
        <button type="button" class="tg" data-model="bar" aria-pressed="true">막대</button>
        <button type="button" class="tg" data-model="circle" aria-pressed="true">원</button>
        <button type="button" class="tg" data-model="line" aria-pressed="true">수직선</button>
      </div>
      <figure class="model model-bar" id="model-bar">
        <figcaption>막대 — 길이 <span class="cap-sum" id="cap-bar"></span></figcaption>
        <svg id="svg-bar" role="img"></svg>
      </figure>
      <figure class="model model-circle" id="model-circle">
        <figcaption>원 — 넓이 <span class="cap-sum" id="cap-circle"></span></figcaption>
        <svg id="svg-circle" role="img"></svg>
      </figure>
      <figure class="model model-line" id="model-line">
        <figcaption>수직선 — 수 <span class="cap-sum" id="cap-line"></span></figcaption>
        <svg id="svg-line" role="img"></svg>
      </figure>
    </section>

    <!-- 같게 쪼개기·합치기 -->
    <section class="panel panel-equiv" aria-labelledby="h-equiv">
      <h2 id="h-equiv">같게 쪼개기 · 합치기</h2>
      <div class="btn-row">
        <button type="button" class="btn primary" data-action="split2" aria-label="모든 칸을 2배로 쪼개기">×2</button>
        <button type="button" class="btn primary" data-action="split3" aria-label="모든 칸을 3배로 쪼개기">×3</button>
        <button type="button" class="btn" data-action="reduce">합치기(약분)</button>
      </div>
      <div class="chain-head">
        <h3>동치 사슬</h3>
        <button type="button" class="tb small" data-action="chain-clear">처음으로</button>
      </div>
      <div class="chain" id="chain" aria-live="polite"></div>
    </section>
  </main>

  <footer class="app-footer">바이브코딩으로 만드는 교육용 앱 · 분수교구함 · 2026 · 내장된 데이터는 모두 가상의 샘플입니다</footer>
  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite"></div>
  <script src="js/app.js"></script>
</body>
</html>
