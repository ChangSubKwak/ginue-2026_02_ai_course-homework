<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>연산수호대</title>
  <meta name="description" content="답을 입력해 쏘는 연산 타워 디펜스 — 틀린 문제는 '복수 몬스터'로 다시 돌아온다">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="storage-warn" class="storage-warn no-print" hidden>⚠ 저장 불가 — 이 기기에서는 저장이 꺼져 있어 이번 세션만 유지됩니다</div>
<header class="app-header no-print">
  <div class="brand">
    <span class="logo" aria-hidden="true"><svg viewBox="0 0 40 40" width="40" height="40"><path d="M20 3 5 9v11c0 9 6.5 15 15 17 8.5-2 15-8 15-17V9z" fill="var(--accent)"/><path d="M20 8 10 12v8c0 6 4.3 10.5 10 12 5.7-1.5 10-6 10-12v-8z" fill="var(--surface)"/><text x="20" y="27" text-anchor="middle" font-size="16" font-weight="900" fill="var(--accent)" font-family="Arial">+×</text></svg></span>
    <div><h1>연산수호대</h1><p class="tagline">답을 입력해 쏘는 연산 타워 디펜스</p></div>
  </div>
  <div class="toolbar">
    <div class="profile-box">
      <button class="profile-btn" id="profile-btn" data-action="profile-menu" aria-haspopup="listbox" aria-expanded="false"><span class="avatar av-1" id="profile-avatar"></span><span class="profile-text"><b id="profile-name">김하늘</b><small id="profile-sub">5학년 2반 1번</small></span><span aria-hidden="true">▾</span></button>
      <ul class="profile-menu" id="profile-menu" role="listbox" hidden></ul>
    </div>
    <button class="btn" data-action="new-profile">＋ 새 프로필</button>
    <button class="btn" data-action="guest">체험하기</button>
    <button class="icon-btn" data-action="toggle-mute" aria-label="음소거 전환">🔊</button>
    <button class="icon-btn" data-action="toggle-theme" id="theme-btn" aria-label="테마 전환">🌙</button>
    <button class="icon-btn" data-action="help" aria-label="도움말">?</button>
    <button class="icon-btn" data-action="nav" data-view="settings" aria-label="선생님 설정">⚙</button>
  </div>
</header>
<nav class="tabs no-print" role="tablist" id="main-tabs">
  <button role="tab" data-action="nav" data-view="home" aria-selected="true">🏰 홈</button>
  <button role="tab" data-action="nav" data-view="codex" aria-selected="false">📘 도감</button>
  <button role="tab" data-action="nav" data-view="hall" aria-selected="false">🏆 명예의 전당</button>
</nav>
<main id="app">
  <!-- 홈: 프로필 요약 + 학년 탭 + 스테이지 카드 -->
  <section data-view="home">
    <div class="summary-card card" id="summary-card"></div>
    <div class="grade-tabs" role="tablist" id="grade-tabs"></div>
    <div class="stage-grid" id="stage-grid"></div>
  </section>
  <!-- 게임: 캔버스 + HUD + 입력 패널 -->
  <section data-view="game" hidden class="game-view" id="game-view">
    <div class="game-layout">
      <div class="stage-wrap" id="stage-wrap">
        <canvas id="game-canvas" width="960" height="540" aria-label="전투 화면"></canvas>
        <div class="hud">
          <div class="hud-row">
            <span class="hud-score" id="hud-score">0</span>
            <span class="hud-combo" id="hud-combo"></span>
            <span class="hud-hearts" id="hud-hearts" aria-label="성 HP"></span>
            <span class="hud-wave" id="hud-wave">WAVE 1/10</span>
            <span class="hud-time" id="hud-time" hidden></span>
            <span class="hud-adapt" id="hud-adapt" aria-live="polite"></span>
          </div>
          <div class="hud-row hud-right">
            <span class="gauge" id="hud-gauge" aria-label="필살기 게이지"><i></i><i></i></span>
            <button class="hud-btn" id="super-btn" data-action="super" disabled>⚡ 필살기</button>
            <button class="hud-btn icon" data-action="toggle-mute" aria-label="음소거 전환">🔊</button>
            <button class="hud-btn icon" data-action="pause" aria-label="일시정지">⏸</button>
            <button class="hud-btn icon" data-action="fullscreen" aria-label="전체화면">⛶</button>
          </div>
        </div>
      </div>
      <aside class="input-panel" id="input-panel"></aside>
    </div>
  </section>
  <!-- 결과 -->
  <section data-view="result" hidden id="result-view"></section>
  <!-- 도감 -->
  <section data-view="codex" hidden id="codex-view"></section>
  <!-- 명예의 전당 -->
  <section data-view="hall" hidden id="hall-view"></section>
  <!-- 선생님 설정 -->
  <section data-view="settings" hidden id="settings-view">
    <h2 class="view-title">⚙ 선생님 설정</h2>
    <div id="pin-gate" class="card" hidden></div>
    <div id="settings-body">
      <div class="card">
        <h3>게임 설정</h3>
        <div class="setting-row"><label>활성 스테이지</label><div id="active-stages" class="stage-checks"></div></div>
        <div class="setting-row"><label>몬스터 속도</label><div class="radio-group" id="speed-group">
          <label><input type="radio" name="speed" value="slow"> 느리게 ×0.75</label><label><input type="radio" name="speed" value="normal"> 보통 ×1.0</label><label><input type="radio" name="speed" value="fast"> 빠르게 ×1.3</label></div></div>
        <div class="setting-row"><label for="time-limit">1회 플레이 시간 제한</label><select id="time-limit" data-setting="timeLimitMin"><option value="0">없음</option><option value="3">3분</option><option value="5">5분</option><option value="10">10분</option></select></div>
        <div class="toggle-grid">
          <label class="toggle"><input type="checkbox" data-setting="rankingPublic"> 랭킹 공개</label>
          <label class="toggle"><input type="checkbox" data-setting="unlockAll"> 전체 스테이지 해금</label>
          <label class="toggle"><input type="checkbox" data-setting="adaptive"> 적응형 난이도</label>
          <label class="toggle"><input type="checkbox" data-setting="lowGradeChoice"> 저학년(1-1~2-2) 3지선다</label>
          <label class="toggle"><input type="checkbox" data-setting="lowSpec"> 저사양 모드</label>
          <label class="toggle"><input type="checkbox" data-setting="bigText"> 큰 글씨 모드(전자칠판)</label>
          <label class="toggle"><input type="checkbox" data-setting="muted"> 음소거</label>
        </div>
        <div class="setting-row"><label for="volume">효과음 볼륨 <output id="volume-out">0.4</output></label><input type="range" id="volume" min="0" max="1" step="0.05" data-setting="volume"></div>
        <div class="setting-row"><label for="pin-input">교사 PIN(4자리, 비우면 해제)</label><div class="inline"><input type="text" id="pin-input" inputmode="numeric" maxlength="4" placeholder="예: 1234"><button class="btn" data-action="save-pin">PIN 저장</button><span class="muted" id="pin-status"></span></div></div>
      </div>
      <div class="card">
        <h3>프로필 관리 <span class="muted" id="profile-count"></span></h3>
        <div class="table-wrap"><table class="table" id="profile-table"></table></div>
        <div class="inline">
          <button class="btn" data-action="new-profile">＋ 프로필 추가</button>
          <label class="drop-zone small" id="roster-drop">명단 CSV 가져오기(번호,이름) — 끌어 놓거나 <input type="file" id="roster-file" accept=".csv,text/csv" hidden><span class="link">파일 선택</span></label>
        </div>
      </div>
      <div class="card">
        <h3>데이터</h3>
        <div class="inline wrap">
          <button class="btn" data-action="export-json">JSON 백업</button>
          <button class="btn" data-action="export-records">기록 CSV</button>
          <button class="btn" data-action="export-weak">약점 문제 CSV</button>
          <button class="btn danger-outline" data-action="reset-sample">샘플 데이터로 초기화</button>
        </div>
        <label class="drop-zone" id="json-drop">JSON 백업 파일을 여기에 끌어 놓거나 <input type="file" id="json-file" accept=".json,application/json" hidden><span class="link">파일 선택</span></label>
        <p class="muted" id="save-status">마지막 저장: —</p>
      </div>
    </div>
  </section>
</main>
<footer class="app-footer no-print">바이브코딩으로 만드는 교육용 앱 · 연산수호대 · 2026 · 내장된 데이터는 모두 가상의 샘플입니다</footer>
<div id="print-root" class="print-only"></div>
<div id="modal-root"></div>
<div id="toast-root" aria-live="polite"></div>
<script src="js/data.js"></script>
<script src="js/problems.js"></script>
<script src="js/audio.js"></script>
<script src="js/game.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
</body>
</html>
