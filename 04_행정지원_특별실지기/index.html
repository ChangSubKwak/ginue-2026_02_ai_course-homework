<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>특별실지기</title>
  <meta name="description" content="과학실·강당·컴퓨터실과 태블릿 세트까지, 학교 공유 자원을 주간 교시 격자에서 드래그로 예약하고 이중 예약을 즉시 잡아내는 학교 공유 자원 예약판">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Gothic+A1:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <style id="print-page-style">@page { size: A4 landscape; margin: 12mm; }</style>
</head>
<body>
  <div class="page">
    <header class="app-header">
      <div class="brand">
        <span class="logo" aria-hidden="true">
          <svg viewBox="0 0 40 40" width="40" height="40"><rect x="3" y="3" width="34" height="34" rx="4" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M3 14h34M3 25h34M14 3v34M25 3v34" stroke="currentColor" stroke-width="1.6"/><rect x="15.5" y="15.5" width="8" height="19" fill="currentColor"/></svg>
        </span>
        <div class="brand-text">
          <h1>특별실지기</h1>
          <p class="tagline">학교 공유 자원 주간 예약판 · 충돌 검사 · 운영 실적 보고</p>
        </div>
      </div>
      <div class="toolbar">
        <span id="school-label" class="school-label">학교명 · 학기</span>
        <span id="save-status" class="save-status" title="저장됨"><i></i><span>저장됨</span></span>
        <button type="button" id="btn-data" class="icon-btn" aria-label="데이터 관리(설정 탭)" title="데이터 관리">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button type="button" id="btn-help" class="icon-btn" aria-label="도움말" title="도움말">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9.5 9.5a2.5 2.5 0 015 0c0 1.5-2.5 2-2.5 3.5M12 17h.01" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <button type="button" id="btn-theme" class="icon-btn" aria-label="테마 전환(라이트/다크)" title="테마 전환">
          <svg class="ic-moon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M20 14.5A8 8 0 019.5 4a8 8 0 1010.5 10.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
          <svg class="ic-sun" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
    </header>

    <div id="mem-banner" class="mem-banner" hidden role="alert">저장 불가 — 메모리 모드로 동작 중입니다. 창을 닫으면 데이터가 사라지니 설정 탭에서 JSON 내보내기를 해 두세요.</div>

    <nav class="tabs" role="tablist" aria-label="화면 선택">
      <button type="button" role="tab" data-tab="board" aria-selected="true">예약판</button>
      <button type="button" role="tab" data-tab="calendar" aria-selected="false">학사일정</button>
      <button type="button" role="tab" data-tab="resources" aria-selected="false">특별실·기자재</button>
      <button type="button" role="tab" data-tab="stats" aria-selected="false">통계</button>
      <button type="button" role="tab" data-tab="settings" aria-selected="false">설정</button>
    </nav>

    <main id="app">
      <section data-view="board" aria-label="예약판"></section>
      <section data-view="calendar" aria-label="학사일정" hidden></section>
      <section data-view="resources" aria-label="자원·명단 관리" hidden></section>
      <section data-view="stats" aria-label="통계·보고" hidden></section>
      <section data-view="settings" aria-label="설정·데이터" hidden></section>
    </main>

    <footer class="app-footer">바이브코딩으로 만드는 교육용 앱 · 특별실지기 · 2026 · 내장된 데이터는 모두 가상의 샘플입니다</footer>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite"></div>
  <div id="print-root" aria-hidden="true"></div>

  <script src="js/data.js"></script>
  <script src="js/core.js"></script>
  <script src="js/board.js"></script>
  <script src="js/views.js"></script>
</body>
</html>
