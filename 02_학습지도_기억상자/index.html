<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>기억상자</title>
  <meta name="description" content="외울 것과 틀린 것을 상자에 넣고, 잊기 직전에 다시 만나는 초등 간격 반복 복습·오답 노트">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Nanum+Gothic:wght@400;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app" id="app-shell">
    <!-- 저장 불가 배너(localStorage 차단·용량 초과 시) -->
    <div id="storage-banner" class="banner banner-warn" role="alert" hidden>
      <span>저장이 되지 않아요. 지금은 메모리에서만 동작해요. 설정에서 JSON으로 내보내 보관하세요.</span>
      <button class="btn btn-sm btn-ghost" type="button" data-action="goto" data-view="settings">설정으로</button>
    </div>

    <header class="app-header">
      <div class="brand">
        <span class="logo" aria-hidden="true">
          <svg viewBox="0 0 48 48" width="40" height="40"><path d="M6 18l18-9 18 9v18l-18 9-18-9z" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/><path d="M6 18l18 9 18-9M24 27v18" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/><path d="M15 13.5l18 9" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round"/></svg>
        </span>
        <div class="brand-text">
          <h1>기억상자</h1>
          <p class="tagline">잊기 직전에 다시 만나는 간격 반복 복습 · 오답 노트</p>
        </div>
      </div>
      <div class="toolbar">
        <button class="chip chip-profile" type="button" data-action="profile-menu" id="profile-chip" aria-haspopup="true" aria-label="프로필 전환"><span class="chip-emoji">🐳</span><span class="chip-name">김하늘</span><span class="chip-caret" aria-hidden="true">▾</span></button>
        <button class="icon-btn" type="button" data-action="theme" id="theme-btn" aria-label="테마 전환">🌙</button>
        <button class="icon-btn" type="button" data-action="help" aria-label="도움말">?</button>
      </div>
    </header>

    <!-- 하단(모바일)/상단(데스크톱) 탭바 -->
    <nav class="tabs" role="tablist" id="tabs" aria-label="화면 이동">
      <button class="tab" role="tab" type="button" data-view="home" aria-selected="true" id="tab-home"><span class="tab-ico" aria-hidden="true">🏠</span><span>홈</span></button>
      <button class="tab" role="tab" type="button" data-view="cards" aria-selected="false" id="tab-cards"><span class="tab-ico" aria-hidden="true">🗂️</span><span>카드</span></button>
      <button class="tab" role="tab" type="button" data-view="history" aria-selected="false" id="tab-history"><span class="tab-ico" aria-hidden="true">📈</span><span>기록</span></button>
      <button class="tab" role="tab" type="button" data-view="exam" aria-selected="false" id="tab-exam"><span class="tab-ico" aria-hidden="true">📅</span><span>시험</span></button>
      <button class="tab" role="tab" type="button" data-view="print" aria-selected="false" id="tab-print"><span class="tab-ico" aria-hidden="true">🖨️</span><span>인쇄</span></button>
      <button class="tab" role="tab" type="button" data-view="teacher" aria-selected="false" id="tab-teacher" hidden><span class="tab-ico" aria-hidden="true">🧑‍🏫</span><span>교사</span></button>
      <button class="tab" role="tab" type="button" data-view="settings" aria-selected="false" id="tab-settings"><span class="tab-ico" aria-hidden="true">⚙️</span><span>설정</span></button>
    </nav>

    <main id="app">
      <section data-view="home" id="view-home" role="tabpanel" aria-labelledby="tab-home"></section>
      <section data-view="cards" id="view-cards" role="tabpanel" aria-labelledby="tab-cards" hidden></section>
      <section data-view="history" id="view-history" role="tabpanel" aria-labelledby="tab-history" hidden></section>
      <section data-view="exam" id="view-exam" role="tabpanel" aria-labelledby="tab-exam" hidden></section>
      <section data-view="print" id="view-print" role="tabpanel" aria-labelledby="tab-print" hidden></section>
      <section data-view="teacher" id="view-teacher" role="tabpanel" aria-labelledby="tab-teacher" hidden></section>
      <section data-view="settings" id="view-settings" role="tabpanel" aria-labelledby="tab-settings" hidden></section>
    </main>

    <footer class="app-footer">바이브코딩으로 만드는 교육용 앱 · 기억상자 · 2026 · 내장된 데이터는 모두 가상의 샘플입니다</footer>
    <button class="fab" type="button" data-action="quick-add" aria-label="카드 빠른 추가" title="카드 추가">+</button>
  </div>

  <!-- 복습 세션(전체 화면) -->
  <section id="session" class="session" aria-label="복습 세션" hidden></section>
  <!-- 인쇄 미리보기 영역 -->
  <div id="print-view" class="print-view" hidden>
    <div class="print-toolbar no-print">
      <button class="btn btn-ghost" type="button" data-action="print-back">← 돌아가기</button>
      <span class="print-hint">인쇄 설정: 여백 없음 · 배율 100% · 양면은 '긴 쪽 넘김'</span>
      <button class="btn btn-primary" type="button" data-action="print-now">🖨️ 인쇄</button>
    </div>
    <div id="print-area" class="print-area"></div>
  </div>
  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite"></div>

  <script src="js/util.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
